<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 80" width="110mm" height="80mm" class="retro" role="img" aria-label="Controetichetta di Scavet, formato orizzontale">
  <style>
    .deco { font-family: Federo, "Poiret One", "Futura", sans-serif; }
    .t { font-family: Jost, "Futura", "Century Gothic", sans-serif; fill: #1D1D1B; }
    .ph { fill: #E06A0E; }
    .w { fill: #FFFFFF; }
    .wph { fill: #F2DA4A; }
  </style>

  <!-- cornice verde e campo bianco con filo oro, come il fronte -->
  <rect width="110" height="80" fill="#1B9238"/>
  <rect x="6" y="4" width="98" height="62" fill="#FFFFFF" stroke="#B18D13" stroke-width=".34"/>

  <!-- colonna sinistra: nome, denominazione, racconto -->
  <text class="deco" x="11" y="13.6" font-size="6.8" letter-spacing=".5" fill="#111111">SCAVET</text>
  <text class="t" x="11" y="18.4" font-size="2.5" font-weight="500" letter-spacing=".25">COLLI TORTONESI CORTESE</text>
  <text class="t" x="11" y="21.5" font-size="2" font-weight="400" letter-spacing=".05">DENOMINAZIONE DI ORIGINE CONTROLLATA</text>
  <line x1="11" y1="24.6" x2="21" y2="24.6" stroke="#B18D13" stroke-width=".3"/>

  <g class="t" font-size="2.3" font-weight="300">
    <text x="11" y="29.2">In dialetto, <tspan font-style="italic">scavet</tspan> è un piccolo scasso:</text>
    <text x="11" y="32.4">il pezzo di terra che nostro nonno ha</text>
    <text x="11" y="35.6">preparato con l'aratro, senza scavatore.</text>
    <text x="11" y="38.8">Oggi l'uva la raccogliamo noi, a mano.</text>
    <text x="11" y="42">Cortese, 980 bottiglie:</text>
    <text x="11" y="45.2">il nostro primo vino.</text>
  </g>
  <text class="t" x="11" y="49.2" font-size="2.3" font-style="italic" font-weight="400">Matteo e Sara</text>

  <line x1="63.5" y1="9" x2="63.5" y2="49.5" stroke="#B18D13" stroke-width=".2"/>

  <!-- colonna destra: volume e grado nello stesso campo visivo della denominazione -->
  <text class="t" x="67" y="15.8" font-size="5.8" font-weight="400">750 ml</text>
  <text class="t" x="67" y="22.2" font-size="4.4" font-weight="400">12,5% vol</text>
  <g class="t" font-size="2.7" font-weight="300">
    <text x="67" y="27.6" font-weight="500">Contiene solfiti</text>
    <text x="67" y="31.2">Vendemmia 2025</text>
    <text x="67" y="34.8">Bottiglia N° <tspan class="ph">___</tspan>/980</text>
  </g>

  <!-- QR per ingredienti e dichiarazione nutrizionale -->
  <rect x="67" y="38" width="11.5" height="11.5" fill="none" stroke="#E06A0E" stroke-width=".25" stroke-dasharray=".8 .6"/>
  <text class="t ph" x="72.75" y="44.5" font-size="2" font-weight="500" text-anchor="middle">QR</text>
  <g class="t" font-size="2.6" font-weight="400">
    <text x="80.5" y="42.2">Ingredienti</text>
    <text x="80.5" y="45.2">e valori</text>
    <text x="80.5" y="48.2">nutrizionali</text>
  </g>

  <!-- striscia in basso: imbottigliatore, lotto, energia -->
  <line x1="11" y1="52.4" x2="99" y2="52.4" stroke="#625D26" stroke-width=".18"/>
  <g class="t" font-size="2.6" font-weight="300">
    <text x="11" y="56.6">Imbottigliato per Costa del Bosco S.S. Soc. Agr., <tspan class="ph">Comune</tspan> – Italia</text>
    <text x="11" y="59.7">da Az. Agr. Mandirola Enrico, Casasco – Italia · Lotto L. 15326</text>
    <text x="11" y="62.8">E (100 ml) = 300 kJ / 72 kcal · Prodotto in Italia</text>
  </g>

  <!-- fascia verde: nome e tre punti come il fronte, a destra lo smaltimento -->
  <text class="deco w" x="11" y="74.6" font-size="4.4" letter-spacing=".15">COSTA DEL BOSCO</text>
  <circle cx="59.5" cy="73.1" r=".75" fill="#EB7A1C"/>
  <circle cx="62" cy="73.1" r=".75" fill="#B58C0C"/>
  <circle cx="64.5" cy="73.1" r=".75" fill="#EAD137"/>
  <g class="t w" font-size="1.5" font-weight="400" text-anchor="end">
    <text x="99" y="71">Bottiglia GL 71 · Tappo <tspan class="wph">___</tspan> · Capsula <tspan class="wph">___</tspan></text>
    <text x="99" y="73.4">Raccolta vetro. Verifica le disposizioni</text>
    <text x="99" y="75.8">del tuo Comune.</text>
  </g>
</svg>
