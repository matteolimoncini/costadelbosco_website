<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 110" width="90mm" height="110mm" class="retro" role="img" aria-label="Controetichetta di Scavet">
  <style>
    .deco { font-family: Federo, "Poiret One", "Futura", sans-serif; }
    .t { font-family: Jost, "Futura", "Century Gothic", sans-serif; fill: #1D1D1B; }
    .ph { fill: #E06A0E; }
    .w { fill: #FFFFFF; }
    .wph { fill: #F2DA4A; }
  </style>

  <!-- cornice e campo, stesse misure del fronte -->
  <rect width="90" height="110" fill="#1B9238"/>
  <rect x="10.75" y="4.65" width="68.5" height="83.75" fill="#FFFFFF" stroke="#B18D13" stroke-width=".34"/>

  <!-- nome del vino e denominazione -->
  <text class="deco" x="45" y="13.2" font-size="7.2" text-anchor="middle" letter-spacing=".5" fill="#111111">SCAVET</text>
  <text class="t" x="45" y="17.6" font-size="2.5" font-weight="500" text-anchor="middle" letter-spacing=".42">COLLI TORTONESI CORTESE</text>
  <text class="t" x="45" y="20.6" font-size="2.1" font-weight="400" text-anchor="middle" letter-spacing=".3">DENOMINAZIONE DI ORIGINE CONTROLLATA</text>
  <line x1="40" y1="23.4" x2="50" y2="23.4" stroke="#B18D13" stroke-width=".3"/>

  <!-- racconto -->
  <g class="t" font-size="2.45" font-weight="300" text-anchor="middle">
    <text x="45" y="28.4">In dialetto, <tspan font-style="italic">scavet</tspan> è un piccolo scasso.</text>
    <text x="45" y="31.9">È la vigna che nostro nonno ha preparato</text>
    <text x="45" y="35.4">con l'aratro, senza scavatore, su un</text>
    <text x="45" y="38.9">fazzoletto di terra. Oggi la vendemmiamo</text>
    <text x="45" y="42.4">noi, a mano. Cortese, 1.000 bottiglie:</text>
    <text x="45" y="45.9">il nostro primo vino.</text>
  </g>
  <text class="t" x="45" y="50" font-size="2.45" font-style="italic" font-weight="400" text-anchor="middle">Matteo e Sara</text>

  <!-- dati della vigna -->
  <line x1="15" y1="53" x2="75" y2="53" stroke="#625D26" stroke-width=".18"/>
  <g class="t" text-anchor="middle">
    <text x="25" y="56.4" font-size="1.6" font-weight="500" letter-spacing=".3">VIGNA</text>
    <text x="45" y="56.4" font-size="1.6" font-weight="500" letter-spacing=".3">VENDEMMIA</text>
    <text x="65" y="56.4" font-size="1.6" font-weight="500" letter-spacing=".3">BOTTIGLIA</text>
    <text x="25" y="59.6" font-size="2.25" font-weight="300">Avolasca (AL)</text>
    <text x="45" y="59.6" font-size="2.25" font-weight="300"><tspan class="ph">20__</tspan>, a mano</text>
    <text x="65" y="59.6" font-size="2.25" font-weight="300">N° <tspan class="ph">____</tspan> di 1.000</text>
  </g>
  <line x1="15" y1="62" x2="75" y2="62" stroke="#625D26" stroke-width=".18"/>

  <!-- indicazioni obbligatorie: denominazione, grado e volume stanno nello stesso campo visivo -->
  <text class="t" x="15" y="69" font-size="4.6" font-weight="400"><tspan class="ph">__,_</tspan> % vol</text>
  <text class="t" x="75" y="69.2" font-size="5.8" font-weight="400" text-anchor="end">750 ml ℮</text>

  <g class="t" font-size="2.3" font-weight="300">
    <text x="15" y="74" font-weight="500" font-size="2.6">Contiene solfiti</text>
    <text x="15" y="77.3">Imbottigliato da <tspan class="ph">ragione sociale</tspan></text>
    <text x="15" y="80.4"><tspan class="ph">Comune (AL)</tspan> · Prodotto in Italia</text>
    <text x="15" y="83.6">Lotto <tspan class="ph">L. ____</tspan> · E (100 ml) = <tspan class="ph">___</tspan> kcal</text>
  </g>

  <!-- QR per ingredienti e dichiarazione nutrizionale -->
  <rect x="63" y="71.4" width="12" height="12" fill="none" stroke="#E06A0E" stroke-width=".25" stroke-dasharray=".8 .6"/>
  <text class="t ph" x="69" y="78.1" font-size="2" font-weight="500" text-anchor="middle">QR</text>
  <text class="t" x="69" y="86" font-size="1.45" font-weight="400" text-anchor="middle">Ingredienti e valori</text>

  <!-- fascia verde, come sul fronte -->
  <text class="deco w" x="45" y="96" font-size="4.8" text-anchor="middle" letter-spacing=".15">COSTA DEL BOSCO</text>
  <circle cx="42.55" cy="99.4" r=".85" fill="#EB7A1C"/>
  <circle cx="45" cy="99.4" r=".85" fill="#B58C0C"/>
  <circle cx="47.45" cy="99.4" r=".85" fill="#EAD137"/>
  <g class="t w" font-size="1.6" font-weight="400" text-anchor="middle">
    <text x="45" y="104">Bottiglia GL 71 · Tappo <tspan class="wph">____</tspan> · Capsula <tspan class="wph">____</tspan></text>
    <text x="45" y="106.6">Raccolta vetro. Verifica le disposizioni del tuo Comune.</text>
  </g>
</svg>
